name: Build AlexLMP Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create clean Flutter scaffold
        run: |
          flutter create --org com.alexlmp.app --project-name alex_lmp app_build

      - name: Copy project files into scaffold
        run: |
          cp custom/pubspec.yaml app_build/pubspec.yaml
          cp custom/main.dart app_build/lib/main.dart
          cp custom/AndroidManifest.xml app_build/android/app/src/main/AndroidManifest.xml
          rm -rf app_build/android/app/src/main/kotlin
          mkdir -p app_build/android/app/src/main/kotlin/com/alexlmp/app
          cp custom/MainActivity.kt app_build/android/app/src/main/kotlin/com/alexlmp/app/MainActivity.kt
          cp custom/YtMusicBridge.kt app_build/android/app/src/main/kotlin/com/alexlmp/app/YtMusicBridge.kt

      - name: Upgrade Android build tooling (needed by NewPipeExtractor)
        working-directory: app_build/android
        run: |
          # NewPipeExtractor needs core library desugaring with desugar_jdk_libs_nio,
          # which needs a newer Android Gradle Plugin than the Flutter 3.24 template ships.
          sed -i -E 's/(id "com\.android\.application" version ")[^"]+(")/\18.3.2\2/' settings.gradle
          sed -i -E 's/(id "org\.jetbrains\.kotlin\.android" version ")[^"]+(")/\11.9.24\2/' settings.gradle
          sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip#' gradle/wrapper/gradle-wrapper.properties
          printf '\nkotlin.jvm.target.validation.mode=warning\nandroid.suppressUnsupportedCompileSdk=35\n' >> gradle.properties
          printf '\nallprojects {\n    repositories {\n        maven { url "https://jitpack.io" }\n    }\n}\n' >> build.gradle
          echo "--- settings.gradle"; cat settings.gradle
          echo "--- gradle-wrapper.properties"; cat gradle/wrapper/gradle-wrapper.properties

      - name: Generate AlexLMP Adaptive Launch Icons
        run: |
          RES="app_build/android/app/src/main/res"
          mkdir -p "$RES/drawable"
          mkdir -p "$RES/mipmap-anydpi-v26"

          cat << 'EOF' > "$RES/drawable/ic_launcher_background.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z" android:fillColor="#050814"/>
          </vector>
          EOF

          cat << 'EOF' > "$RES/drawable/ic_launcher_foreground.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path
                  android:pathData="M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C72.78,88 88,72.78 88,54 C88,35.22 72.78,20 54,20 Z"
                  android:fillColor="#101830"/>
              <path
                  android:pathData="M40,54 L40,62 M48,42 L48,66 M56,34 L56,74 M64,48 L64,60 M72,52 L72,56"
                  android:strokeWidth="5.5"
                  android:strokeLineCap="round"
                  android:strokeColor="#567CFF"/>
          </vector>
          EOF

          cat << 'EOF' > "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          python3 - << 'PYEOF'
          import os, struct, zlib, math

          def make_png(size):
              pixels = bytearray(size * size * 4)
              cx = cy = size / 2.0
              for y in range(size):
                  for x in range(size):
                      dx, dy = x - cx, y - cy
                      dist = math.hypot(dx, dy)
                      idx = (y * size + x) * 4
                      if dist > size * 0.48:
                          pixels[idx:idx+4] = bytes([0, 0, 0, 0])
                          continue
                      pixels[idx:idx+4] = bytes([5, 8, 20, 255])
                      if dist <= size * 0.38:
                          pixels[idx:idx+4] = bytes([16, 24, 48, 255])
                      nx = (x - cx) / (size * 0.34)
                      ny = abs(y - cy) / (size * 0.34)
                      bars = [(-0.4, 0.3), (-0.15, 0.65), (0.1, 0.8), (0.35, 0.45)]
                      for bx, bh in bars:
                          if abs(nx - bx) < 0.08 and ny < bh:
                              pixels[idx:idx+4] = bytes([86, 124, 255, 255])

              raw = bytearray()
              for y in range(size):
                  raw.append(0)
                  raw.extend(pixels[y*size*4:(y+1)*size*4])
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          base = "app_build/android/app/src/main/res"
          for folder, sz in sizes.items():
              p = os.path.join(base, folder)
              os.makedirs(p, exist_ok=True)
              data = make_png(sz)
              with open(os.path.join(p, "ic_launcher.png"), "wb") as f:
                  f.write(data)
              with open(os.path.join(p, "ic_launcher_round.png"), "wb") as f:
                  f.write(data)
          PYEOF

      - name: Configure Gradle for Android SDK 35
        run: |
          cat << 'EOF' > app_build/android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.alexlmp.app"
              compileSdk = 35
              ndkVersion = "26.1.10909125"

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled = true
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.alexlmp.app"
                  minSdk = 24
                  targetSdk = 35
                  // Filled in by the workflow: build number + kAppVersion from main.dart.
                  versionCode = (System.getenv("VERSION_CODE") ?: "2").toInteger()
                  versionName = System.getenv("VERSION_NAME") ?: "2.0.0"
              }

              // One permanent key (from GitHub secrets) so every update installs
              // over the last one and Play Protect learns to recognise the app.
              signingConfigs {
                  release {
                      def ks = file("release.jks")
                      if (ks.exists()) {
                          storeFile = ks
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("KEY_ALIAS")
                          keyPassword = System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      signingConfig = file("release.jks").exists()
                          ? signingConfigs.release
                          : signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.0.4"
              implementation "com.github.teamnewpipe:NewPipeExtractor:v0.26.5"
          }
          EOF

      - name: Set up signing key and version
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app_build/android/app/release.jks
            echo "Signing with the permanent release key."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - signing with a throwaway debug key. Updates won't install over older versions."
          fi
          VERSION_NAME=$(grep -oP "kAppVersion = '\K[^']+" custom/main.dart || echo "2.0.0")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "Building version $VERSION_NAME"

      - name: Build APK
        working-directory: app_build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: alexlmp
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlexLMP-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
