# FILE: .github/workflows/build.yml
name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android project
        run: flutter create . --org com.alexdesrosier --project-name audio_player --platforms android

      - name: Overwrite with custom files
        run: |
          cp custom/pubspec.yaml pubspec.yaml
          cp custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp custom/main.dart lib/main.dart
          rm -rf test analysis_options.yaml
          find android/app/src/main -name 'MainActivity.*' -delete
          mkdir -p android/app/src/main/kotlin/com/alexdesrosier/audio_player
          cp custom/MainActivity.kt android/app/src/main/kotlin/com/alexdesrosier/audio_player/MainActivity.kt

      - name: Force compileSdk 36 on app and all plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat > /tmp/patch.kts <<'EOF'
          subprojects {
              if (!state.executed) {
                  afterEvaluate {
                      val androidExt = extensions.findByName("android")
                      if (androidExt != null) {
                          androidExt.withGroovyBuilder {
                              "compileSdkVersion"(36)
                          }
                      }
                  }
              }
          }

          EOF
            cat /tmp/patch.kts android/build.gradle.kts > /tmp/root.kts
            mv /tmp/root.kts android/build.gradle.kts
          else
            cat > /tmp/patch.gradle <<'EOF'
          subprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
          }

          EOF
            cat /tmp/patch.gradle android/build.gradle > /tmp/root.gradle
            mv /tmp/root.gradle android/build.gradle
          fi
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdk(Version)?\s*=?\s*flutter\.compileSdkVersion/compileSdk = 36/' "$f"
              sed -i -E 's/targetSdk(Version)?\s*=?\s*flutter\.targetSdkVersion/targetSdk = 35/' "$f"
            fi
          done

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: audio-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
