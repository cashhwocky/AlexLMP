# FILE: .github/workflows/build.yml
name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android project
        run: flutter create . --org com.alexdesrosier --project-name audio_player --platforms android

      - name: Overwrite with custom files
        run: |
          cp custom/pubspec.yaml pubspec.yaml
          cp custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp custom/main.dart lib/main.dart
          rm -rf test analysis_options.yaml

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: audio-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
