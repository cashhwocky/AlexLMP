name: Build AlexLMP Release APK

on:
  push:
    branches: [ main, master ]
    # Pushing a version tag (v2.8.2, ...) also publishes a GitHub Release.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create clean Flutter scaffold
        run: |
          flutter create --org com.alexlmp.app --project-name alex_lmp app_build

      - name: Copy project files into scaffold
        run: |
          cp custom/pubspec.yaml app_build/pubspec.yaml
          cp custom/main.dart app_build/lib/main.dart
          cp custom/AndroidManifest.xml app_build/android/app/src/main/AndroidManifest.xml
          rm -rf app_build/android/app/src/main/kotlin
          mkdir -p app_build/android/app/src/main/kotlin/com/alexlmp/app
          cp custom/MainActivity.kt app_build/android/app/src/main/kotlin/com/alexlmp/app/MainActivity.kt
          cp custom/YtMusicBridge.kt app_build/android/app/src/main/kotlin/com/alexlmp/app/YtMusicBridge.kt
          cp custom/AlexWidget.kt app_build/android/app/src/main/kotlin/com/alexlmp/app/AlexWidget.kt
          cp custom/UpdateWorker.kt app_build/android/app/src/main/kotlin/com/alexlmp/app/UpdateWorker.kt
          # Home screen widget layouts / icons
          mkdir -p app_build/android/app/src/main/res
          cp -r custom/res/. app_build/android/app/src/main/res/

      - name: Upgrade Android build tooling (needed by NewPipeExtractor)
        working-directory: app_build/android
        run: |
          # NewPipeExtractor needs core library desugaring with desugar_jdk_libs_nio,
          # which needs a newer Android Gradle Plugin than the Flutter 3.24 template ships.
          sed -i -E 's/(id "com\.android\.application" version ")[^"]+(")/\18.3.2\2/' settings.gradle
          sed -i -E 's/(id "org\.jetbrains\.kotlin\.android" version ")[^"]+(")/\11.9.24\2/' settings.gradle
          sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip#' gradle/wrapper/gradle-wrapper.properties
          printf '\nkotlin.jvm.target.validation.mode=warning\nandroid.suppressUnsupportedCompileSdk=35\n' >> gradle.properties
          printf '\nallprojects {\n    repositories {\n        maven { url "https://jitpack.io" }\n    }\n}\n' >> build.gradle
          echo "--- settings.gradle"; cat settings.gradle
          echo "--- gradle-wrapper.properties"; cat gradle/wrapper/gradle-wrapper.properties

      - name: Generate AlexLMP Adaptive Launch Icons
        run: |
          RES="app_build/android/app/src/main/res"
          mkdir -p "$RES/drawable"
          mkdir -p "$RES/mipmap-anydpi-v26"

          cat << 'EOF' > "$RES/drawable/ic_launcher_background.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z" android:fillColor="#101830"/>
          </vector>
          EOF

          cat << 'EOF' > "$RES/drawable/ic_launcher_foreground.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:pivotX="54" android:pivotY="54" android:scaleX="1.35" android:scaleY="1.35">
                  <path android:pathData="M40,50 L40,58 M48,42 L48,66 M56,34 L56,74 M64,48 L64,60 M72,52 L72,56" android:strokeWidth="5.5" android:strokeLineCap="round" android:strokeColor="#567CFF"/>
              </group>
          </vector>
          EOF

          cat << 'EOF' > "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          python3 - << 'PYEOF'
          import os, struct, zlib, math

          def make_png(size):
              pixels = bytearray(size * size * 4)
              cx = cy = size / 2.0
              for y in range(size):
                  for x in range(size):
                      dx, dy = x - cx, y - cy
                      dist = math.hypot(dx, dy)
                      idx = (y * size + x) * 4
                      if dist > size * 0.48:
                          pixels[idx:idx+4] = bytes([0, 0, 0, 0])
                          continue
                      pixels[idx:idx+4] = bytes([5, 8, 20, 255])
                      if dist <= size * 0.38:
                          pixels[idx:idx+4] = bytes([16, 24, 48, 255])
                      nx = (x - cx) / (size * 0.34)
                      ny = abs(y - cy) / (size * 0.34)
                      bars = [(-0.4, 0.3), (-0.15, 0.65), (0.1, 0.8), (0.35, 0.45)]
                      for bx, bh in bars:
                          if abs(nx - bx) < 0.08 and ny < bh:
                              pixels[idx:idx+4] = bytes([86, 124, 255, 255])

              raw = bytearray()
              for y in range(size):
                  raw.append(0)
                  raw.extend(pixels[y*size*4:(y+1)*size*4])
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          base = "app_build/android/app/src/main/res"
          for folder, sz in sizes.items():
              p = os.path.join(base, folder)
              os.makedirs(p, exist_ok=True)
              data = make_png(sz)
              with open(os.path.join(p, "ic_launcher.png"), "wb") as f:
                  f.write(data)
              with open(os.path.join(p, "ic_launcher_round.png"), "wb") as f:
                  f.write(data)
          PYEOF

      - name: Generate app icon choices and launch screen
        run: |
          python3 - << 'PYEOF'
          import os
          R = "app_build/android/app/src/main/res"
          # Full-bleed: the colour fills the whole icon (no circle inside a square),
          # so it looks right in any launcher shape.
          icons = [
              ("classic", ["#101830"], None, None, ["#567CFF"]),
              ("midnight", ["#000000"], None, None, ["#FFFFFF"]),
              ("sunset", ["#FF8A3D", "#E8407A"], None, None, ["#FFD27A", "#FFFFFF"]),
              ("aurora", ["#0B2430"], None, None, ["#3CF2C0", "#8A6CFF"]),
              ("neon", ["#07000F"], None, None, ["#FF2BD6", "#2BE8FF"]),
              ("mint", ["#DFF7EA"], None, None, ["#0E7A4F"]),
              ("ember", ["#2A0D08"], None, None, ["#FFB03A", "#FF3D2E"]),
              ("gold", ["#1A160C"], None, None, ["#F8E3A3", "#C9962E"]),
              ("ocean", ["#0B3D91", "#1CB5E0"], None, None, ["#FFFFFF"]),
          ]
          BARS = "M40,50 L40,58 M48,42 L48,66 M56,34 L56,74 M64,48 L64,60 M72,52 L72,56"
          CIRCLE = "M54,20 C35.22,20 20,35.22 20,54 C20,72.78 35.22,88 54,88 C72.78,88 88,72.78 88,54 C88,35.22 72.78,20 54,20 Z"
          RING = "M54,22 C36.33,22 22,36.33 22,54 C22,71.67 36.33,86 54,86 C71.67,86 86,71.67 86,54 C86,36.33 71.67,22 54,22 Z"
          HEAD = '<?xml version="1.0" encoding="utf-8"?>\n'
          # Bars drawn 1.35x bigger (still inside the launcher's safe zone).
          GROUP_OPEN = '<group android:pivotX="54" android:pivotY="54" android:scaleX="1.35" android:scaleY="1.35">'

          def write(path, text):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f:
                  f.write(text)

          def grad(attr, cols, x1, y1, x2, y2):
              items = "".join('<item android:offset="%.1f" android:color="#FF%s"/>' % (i / (len(cols) - 1), c[1:]) for i, c in enumerate(cols))
              return ('<aapt:attr name="%s"><gradient android:type="linear" android:startX="%s" android:startY="%s" '
                      'android:endX="%s" android:endY="%s">%s</gradient></aapt:attr>') % (attr, x1, y1, x2, y2, items)

          def vec(body):
              return (HEAD + '<vector xmlns:android="http://schemas.android.com/apk/res/android" '
                      'xmlns:aapt="http://schemas.android.com/aapt" android:width="108dp" android:height="108dp" '
                      'android:viewportWidth="108" android:viewportHeight="108">' + body + '</vector>\n')

          for k, bg, disc, ring, bars in icons:
              if len(bg) == 1:
                  b = '<path android:pathData="M0,0h108v108h-108z" android:fillColor="%s"/>' % bg[0]
              else:
                  b = '<path android:pathData="M0,0h108v108h-108z">%s</path>' % grad("android:fillColor", bg, 0, 0, 108, 108)
              write("%s/drawable/ic_alt_%s_bg.xml" % (R, k), vec(b))
              f = ""
              if disc:
                  f += '<path android:pathData="%s" android:fillColor="%s"/>' % (CIRCLE, disc)
              if ring:
                  f += '<path android:pathData="%s" android:strokeWidth="3" android:fillColor="#00000000">%s</path>' % (
                      RING, grad("android:strokeColor", ring, 22, 22, 86, 86))
              f += GROUP_OPEN
              if len(bars) == 1:
                  f += '<path android:pathData="%s" android:strokeWidth="5.5" android:strokeLineCap="round" android:strokeColor="%s"/>' % (BARS, bars[0])
              else:
                  f += '<path android:pathData="%s" android:strokeWidth="5.5" android:strokeLineCap="round">%s</path>' % (
                      BARS, grad("android:strokeColor", bars, 0, 34, 0, 74))
              f += '</group>'
              write("%s/drawable/ic_alt_%s_fg.xml" % (R, k), vec(f))
              write("%s/mipmap-anydpi-v26/ic_alt_%s.xml" % (R, k), HEAD +
                    '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
                    '<background android:drawable="@drawable/ic_alt_%s_bg"/>'
                    '<foreground android:drawable="@drawable/ic_alt_%s_fg"/>'
                    '<monochrome android:drawable="@drawable/ic_alt_mono"/></adaptive-icon>\n' % (k, k))
              # Android 7 (no adaptive icons): background + foreground stacked.
              write("%s/mipmap-anydpi/ic_alt_%s.xml" % (R, k), HEAD +
                    '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">'
                    '<item android:drawable="@drawable/ic_alt_%s_bg"/>'
                    '<item android:drawable="@drawable/ic_alt_%s_fg"/></layer-list>\n' % (k, k))

          # Themed (Material You) icon on Android 13+.
          write("%s/drawable/ic_alt_mono.xml" % R, vec(
              GROUP_OPEN + '<path android:pathData="%s" android:strokeWidth="5.5" android:strokeLineCap="round" android:strokeColor="#FF000000"/></group>' % BARS))

          # Black native launch screen so it flows into the animated one.
          for d in ["drawable", "drawable-v21"]:
              write("%s/%s/launch_background.xml" % (R, d), HEAD +
                    '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">'
                    '<item android:drawable="@android:color/black"/></layer-list>\n')
          STYLES = (HEAD + '<resources>'
                    '<style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">'
                    '<item name="android:windowBackground">@drawable/launch_background</item>%s</style>'
                    '<style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">'
                    '<item name="android:windowBackground">@android:color/black</item></style>'
                    '</resources>\n')
          V31 = '<item name="android:windowSplashScreenBackground">@android:color/black</item>'
          for d, extra in [("values", ""), ("values-night", ""), ("values-v31", V31), ("values-night-v31", V31)]:
              write("%s/%s/styles.xml" % (R, d), STYLES % extra)
          print("App icon + launch screen resources generated")
          PYEOF

      - name: Configure Gradle for Android SDK 35
        run: |
          cat << 'EOF' > app_build/android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.alexlmp.app"
              compileSdk = 35
              ndkVersion = "26.1.10909125"

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled = true
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.alexlmp.app"
                  minSdk = 24
                  targetSdk = 35
                  // Filled in by the workflow: build number + kAppVersion from main.dart.
                  versionCode = (System.getenv("VERSION_CODE") ?: "2").toInteger()
                  versionName = System.getenv("VERSION_NAME") ?: "2.0.0"
              }

              // One permanent key (from GitHub secrets) so every update installs
              // over the last one and Play Protect learns to recognise the app.
              signingConfigs {
                  release {
                      def ks = file("release.jks")
                      if (ks.exists()) {
                          storeFile = ks
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("KEY_ALIAS")
                          keyPassword = System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      signingConfig = file("release.jks").exists()
                          ? signingConfigs.release
                          : signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.0.4"
              implementation "com.github.teamnewpipe:NewPipeExtractor:v0.26.5"
              implementation "androidx.work:work-runtime-ktx:2.9.1"
          }
          EOF

      - name: Set up signing key and version
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app_build/android/app/release.jks
            echo "Signing with the permanent release key."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - signing with a throwaway debug key. Updates won't install over older versions."
          fi
          VERSION_NAME=$(grep -oP "kAppVersion = '\K[^']+" custom/main.dart || echo "2.0.0")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "Building version $VERSION_NAME"
          # On a version tag, the tag must match kAppVersion in main.dart.
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match kAppVersion $VERSION_NAME in custom/main.dart. Update kAppVersion (and pubspec) first."
            exit 1
          fi

      - name: Build APK
        working-directory: app_build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: alexlmp
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlexLMP-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

      - name: Name the APK for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app_build/build/app/outputs/flutter-apk/app-release.apk "AlexLMP-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release with the APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AlexLMP ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: AlexLMP-${{ github.ref_name }}.apk
