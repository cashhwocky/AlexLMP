name: Build AlexLMP for Linux (.deb)

# Only the linux branch and linux-v* release tags. The phone version (main
# branch, v* tags) is never touched by this.
on:
  push:
    branches: [linux]
    tags: ['linux-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build the YouTube Music helper (same bridge as the phone app)
        run: |
          # The phone's YtMusicBridge.kt, minus the Android-only sign-in screen.
          python3 - <<'PY'
          src = open("custom/YtMusicBridge.kt").read()
          cut = src.find("/** Google sign-in page in a WebView")
          if cut > 0:
              src = src[:cut]
          open("linux/ythelper/src/main/kotlin/YtMusicBridge.kt", "w").write(src)
          PY
          gradle -p linux/ythelper shadowJar --no-daemon --stacktrace
          ls -la linux/ythelper/build/libs/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev mpv \
            python3-pil

      - name: Read the version
        run: |
          V=$(tr -d ' \n' < linux/VERSION)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Building AlexLMP for Linux $V"
          if [[ "$GITHUB_REF" == refs/tags/linux-v* && "$GITHUB_REF_NAME" != "linux-v$V" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match linux/VERSION ($V)"; exit 1
          fi

      - name: Create clean Flutter desktop scaffold
        run: flutter create --platforms=linux --org com.alexlmp.app --project-name alex_lmp app_linux

      - name: Copy project files into scaffold
        run: |
          cp custom/pubspec.yaml app_linux/pubspec.yaml
          cp custom/main.dart app_linux/lib/main.dart

      - name: Window title and size
        run: |
          F=$(find app_linux/linux -name my_application.cc | head -1)
          sed -i 's/"alex_lmp"/"AlexLMP"/g' "$F"
          sed -i 's/gtk_window_set_default_size(window, 1280, 720);/gtk_window_set_default_size(window, 1360, 860);/' "$F"
          grep -n "AlexLMP\|default_size" "$F"

      - name: Build
        working-directory: app_linux
        run: |
          flutter pub get
          flutter build linux --release

      - name: Make the app icon
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          S = 512
          img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((16, 16, S - 16, S - 16), radius=120, fill=(255, 255, 255, 255))
          heights = [8, 24, 40, 12, 4]
          k = S / 108 * 1.35
          w = 5.5 * k
          for i, h in enumerate(heights):
              cx = S / 2 + (i - 2) * 8 * k
              top = S / 2 - (h * k) / 2 - w / 2
              bot = S / 2 + (h * k) / 2 + w / 2
              d.rounded_rectangle((cx - w / 2, top, cx + w / 2, bot), radius=w / 2, fill=(17, 19, 24, 255))
          img.save("alexlmp.png")
          PY

      - name: Package .deb
        run: |
          PKG="alexlmp_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/alexlmp" "$PKG/usr/bin" \
            "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/512x512/apps"
          cp -r app_linux/build/linux/x64/release/bundle/* "$PKG/opt/alexlmp/"
          cp linux/ythelper/build/libs/ythelper.jar "$PKG/opt/alexlmp/ythelper.jar"
          cp linux/login.py "$PKG/opt/alexlmp/login.py"
          ln -s /opt/alexlmp/alex_lmp "$PKG/usr/bin/alexlmp"
          cp alexlmp.png "$PKG/usr/share/icons/hicolor/512x512/apps/alexlmp.png"
          cat > "$PKG/usr/share/applications/alexlmp.desktop" <<DESK
          [Desktop Entry]
          Type=Application
          Name=AlexLMP
          GenericName=Music Player
          Comment=All your music, one player.
          Exec=/opt/alexlmp/alex_lmp %U
          Icon=alexlmp
          Terminal=false
          Categories=AudioVideo;Audio;Player;Music;
          StartupWMClass=com.alexlmp.app.alex_lmp
          DESK
          sed -i 's/^          //' "$PKG/usr/share/applications/alexlmp.desktop"
          SIZE=$(du -sk "$PKG/opt" | cut -f1)
          cat > "$PKG/DEBIAN/control" <<CTRL
          Package: alexlmp
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Installed-Size: ${SIZE}
          Depends: libgtk-3-0t64 | libgtk-3-0, libmpv2, zenity, default-jre-headless | java17-runtime-headless, python3-gi, gir1.2-webkit2-4.1 | gir1.2-webkit-6.0
          Maintainer: Alex Desrosier
          Homepage: https://github.com/cashhwocky/AlexLMP
          Description: AlexLMP music player
           All your music, one player. Plays the music on your computer with
           the AlexLMP design, made for desktop.
          CTRL
          sed -i 's/^          //' "$PKG/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG"
          mv "$PKG.deb" "AlexLMP-linux-v${VERSION}-amd64.deb"
          dpkg-deb --info "AlexLMP-linux-v${VERSION}-amd64.deb"
          ls -la *.deb

      - name: Upload the .deb (every build)
        uses: actions/upload-artifact@v4
        with:
          name: AlexLMP-linux-v${{ env.VERSION }}-amd64
          path: AlexLMP-linux-v${{ env.VERSION }}-amd64.deb

      - name: Find a published Linux release for this version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "linux-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "REL_TAG=linux-v$VERSION" >> "$GITHUB_ENV"
          fi

      - name: Publish to the Linux release
        if: startsWith(github.ref, 'refs/tags/linux-v') || env.REL_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG != '' && env.REL_TAG || github.ref_name }}
          name: AlexLMP for Linux v${{ env.VERSION }}
          body_path: linux/RELEASE_NOTES.md
          files: AlexLMP-linux-v${{ env.VERSION }}-amd64.deb
          make_latest: false
