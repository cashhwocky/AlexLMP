name: alex_lmp
description: AlexLMP Material You Music Player
publish_to: 'none'
version: 2.9.4+42

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Pinned: newer versions turn on Android "audio offload", which ignores pitch.
  just_audio: 0.9.42
  audio_session: ^0.1.21
  audio_service: ^0.18.15
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  # Space Grotesk headings in the AlexLMP Signal look.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
